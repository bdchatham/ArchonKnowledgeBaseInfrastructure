apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedding
  labels:
    app: embedding
spec:
  replicas: 1
  selector:
    matchLabels:
      app: embedding
  template:
    metadata:
      labels:
        app: embedding
    spec:
      containers:
        - name: embedding
          image: ghcr.io/bdchatham/archon-knowledge-base:embedding-latest
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: EMBEDDING_MODEL
              valueFrom:
                configMapKeyRef:
                  name: knowledge-base-config
                  key: embedding_model
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 10
