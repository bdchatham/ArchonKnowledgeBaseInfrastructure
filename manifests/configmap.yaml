apiVersion: v1
kind: ConfigMap
metadata:
  name: knowledge-base-config
data:
  # Required: Agent's embedding service URL
  embedding_service_url: "http://vllm.archon-system.svc.cluster.local:8000"
  embedding_model: "BAAI/bge-base-en-v1.5"
  
  # Storage configuration
  vector_db_url: "http://qdrant:6333"
  collection_name: "archon-docs"
  tracker_db_url: "postgresql://archon:password@postgres:5432/archon"
  
  # Retrieval settings
  retrieval_k: "5"
  chunk_size: "1000"
  chunk_overlap: "200"
  
  # Repositories to monitor
  repositories: |
    [
      {
        "url": "https://github.com/bdchatham/ArchonAgent",
        "branch": "main",
        "paths": [".kiro/docs"]
      },
      {
        "url": "https://github.com/bdchatham/AphexPlatformInfrastructure",
        "branch": "main",
        "paths": [".kiro/docs"]
      },
      {
        "url": "https://github.com/bdchatham/ArchonKnowledgeBaseInfrastructure",
        "branch": "main",
        "paths": [".kiro/docs"]
      }
    ]
