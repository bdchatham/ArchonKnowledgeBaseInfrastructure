apiVersion: v1
kind: ConfigMap
metadata:
  name: knowledge-base-config
data:
  # Internal embedding service URL (self-contained)
  embedding_service_url: "http://embedding-svc:8000"
  embedding_model: "BAAI/bge-base-en-v1.5"
  
  # Storage configuration
  vector_db_url: "http://qdrant:6333"
  collection_name: "archon-docs"
  postgres_host: "postgres"
  postgres_port: "5432"
  postgres_db: "archon"
  
  # Retrieval settings
  retrieval_k: "5"
  chunk_size: "1000"
  chunk_overlap: "200"
  
  # Repositories to monitor
  repositories: |
    [
      {
        "url": "https://github.com/bdchatham/ArchonAgent",
        "branch": "mainline",
        "paths": [".kiro/docs"]
      },
      {
        "url": "https://github.com/bdchatham/AphexPlatformInfrastructure",
        "branch": "mainline",
        "paths": [".kiro/docs"]
      },
      {
        "url": "https://github.com/bdchatham/ArchonKnowledgeBaseInfrastructure",
        "branch": "mainline",
        "paths": [".kiro/docs"]
      }
    ]
