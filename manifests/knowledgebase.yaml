apiVersion: aphex.io/v1alpha1
kind: KnowledgeBase
metadata:
  name: archon-knowledge
spec:
  name: "Archon Code Intelligence"
  description: "SCIP-indexed code intelligence for Archon platform repositories"
  organization: archon
  sources:
    - repoOrg: bdchatham
      repoName: AphexAgentController
      branch: mainline
      sourceType: code
    - repoOrg: bdchatham
      repoName: AphexControllerRuntime
      branch: mainline
      sourceType: code
    - repoOrg: bdchatham
      repoName: AphexKnowledgeBaseMCPTools
      branch: mainline
      sourceType: code
  mcp:
    image: ghcr.io/bdchatham/archon-mcp-server:latest
    port: 3000
    replicas: 1
  agent:
    credentialSecretName: "kiro-credentials"
