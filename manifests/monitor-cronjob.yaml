apiVersion: batch/v1
kind: CronJob
metadata:
  name: monitor
  labels:
    app: monitor
spec:
  schedule: "*/15 * * * *"  # Every 15 minutes
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: monitor
        spec:
          restartPolicy: OnFailure
          containers:
          - name: monitor
            image: ghcr.io/bdchatham/archon-kb-monitor:latest
            env:
            - name: EMBEDDING_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: knowledge-base-config
                  key: embedding_service_url
            - name: EMBEDDING_MODEL
              valueFrom:
                configMapKeyRef:
                  name: knowledge-base-config
                  key: embedding_model
            - name: VECTOR_DB_URL
              valueFrom:
                configMapKeyRef:
                  name: knowledge-base-config
                  key: vector_db_url
            - name: COLLECTION_NAME
              valueFrom:
                configMapKeyRef:
                  name: knowledge-base-config
                  key: collection_name
            - name: TRACKER_DB_URL
              valueFrom:
                configMapKeyRef:
                  name: knowledge-base-config
                  key: tracker_db_url
            - name: CHUNK_SIZE
              valueFrom:
                configMapKeyRef:
                  name: knowledge-base-config
                  key: chunk_size
            - name: CHUNK_OVERLAP
              valueFrom:
                configMapKeyRef:
                  name: knowledge-base-config
                  key: chunk_overlap
            - name: REPOSITORIES
              valueFrom:
                configMapKeyRef:
                  name: knowledge-base-config
                  key: repositories
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: knowledge-base-secrets
                  key: github_token
            resources:
              requests:
                memory: "256Mi"
                cpu: "100m"
              limits:
                memory: "512Mi"
