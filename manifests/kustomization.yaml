apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: archon-knowledge-base

resources:
  # Namespace first
  - namespace.yaml
  # Configuration
  - configmap.yaml
  - secrets.yaml
  # StatefulSets (databases) - must be ready before dependents
  - qdrant-statefulset.yaml
  - qdrant-service.yaml
  - postgres-statefulset.yaml
  - postgres-service.yaml
  # Init job - runs after databases are ready
  - init-job.yaml
  # Application workloads
  - query-deployment.yaml
  - query-service.yaml
  - monitor-cronjob.yaml
  # Ingress last
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: archon-knowledge-base
    includeSelectors: true
    includeTemplates: true

generatorOptions:
  disableNameSuffixHash: true
