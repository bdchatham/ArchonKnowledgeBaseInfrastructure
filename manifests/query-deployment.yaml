apiVersion: apps/v1
kind: Deployment
metadata:
  name: query
  labels:
    app: query
spec:
  replicas: 2
  selector:
    matchLabels:
      app: query
  template:
    metadata:
      labels:
        app: query
    spec:
      containers:
      - name: query
        image: ghcr.io/bdchatham/archon-kb-query:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: EMBEDDING_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: knowledge-base-config
              key: embedding_service_url
        - name: EMBEDDING_MODEL
          valueFrom:
            configMapKeyRef:
              name: knowledge-base-config
              key: embedding_model
        - name: VECTOR_DB_URL
          valueFrom:
            configMapKeyRef:
              name: knowledge-base-config
              key: vector_db_url
        - name: COLLECTION_NAME
          valueFrom:
            configMapKeyRef:
              name: knowledge-base-config
              key: collection_name
        - name: RETRIEVAL_K
          valueFrom:
            configMapKeyRef:
              name: knowledge-base-config
              key: retrieval_k
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
