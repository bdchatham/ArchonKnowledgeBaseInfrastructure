apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: knowledge-base
spec:
  parentRefs:
    - name: platform-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - "archon-kb.arbiter-dev.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: query
          port: 8080
