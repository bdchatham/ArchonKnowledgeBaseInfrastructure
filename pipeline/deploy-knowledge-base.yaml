apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: deploy-knowledge-base
  namespace: pipeline-system
  labels:
    app.kubernetes.io/part-of: archon-knowledge-base
spec:
  description: >-
    Deploys the Archon Knowledge Base infrastructure via ArgoCD.
    
    The Knowledge Base is fully self-contained with its own embedding service.
    No external dependencies are required for deployment.
    
    This pipeline creates an ArgoCD Application that syncs the knowledge base
    manifests from Git, deploying Qdrant, PostgreSQL, Embedding service,
    Query service, and Monitor CronJob to the archon-knowledge-base namespace.

  params:
    - name: git-url
      type: string
      description: Git repository URL containing the manifests
      default: https://github.com/bdchatham/ArchonKnowledgeBaseInfrastructure
    - name: git-revision
      type: string
      description: Git revision (branch, tag, or commit SHA)
      default: mainline
    - name: manifest-path
      type: string
      description: Path within the repository containing Kubernetes manifests
      default: manifests
    - name: app-name
      type: string
      description: Name of the ArgoCD Application
      default: archon-knowledge-base
    - name: target-namespace
      type: string
      description: Target namespace for deployment
      default: archon-knowledge-base
    - name: app-project
      type: string
      description: ArgoCD AppProject for isolation
      default: archon-knowledge-base

  tasks:
    - name: deploy-to-argocd
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: argocd-deployment
          - name: namespace
            value: tekton-pipelines
      params:
        - name: app-name
          value: $(params.app-name)
        - name: app-project
          value: $(params.app-project)
        - name: repo-url
          value: $(params.git-url)
        - name: repo-revision
          value: $(params.git-revision)
        - name: manifest-path
          value: $(params.manifest-path)
        - name: target-namespace
          value: $(params.target-namespace)
        - name: auto-sync
          value: "true"
        - name: prune
          value: "true"
        - name: self-heal
          value: "true"
        - name: create-namespace
          value: "false"
        - name: kubectl-image
          value: "bitnami/kubectl:latest"
