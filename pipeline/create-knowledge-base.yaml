apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: create-knowledge-base
  labels:
    app.kubernetes.io/part-of: archon-knowledge-base
spec:
  description: >-
    Creates a KnowledgeBase CRD to configure repository tracking.
    
    This pipeline creates a KnowledgeBase custom resource that configures:
    - Which repositories to track for documentation
    - Documentation paths to monitor (default: .kiro/docs)
    - Optional MCP server for Kiro integration
    
    The platform controller handles document ingestion and monitoring.

  params:
    - name: kb-name
      type: string
      description: Name of the KnowledgeBase resource
      default: platform-docs
    - name: namespace
      type: string
      description: Namespace for the KnowledgeBase
      default: archon-knowledge-base
    - name: display-name
      type: string
      description: Human-readable knowledge base name
      default: Aphex Platform Documentation
    - name: description
      type: string
      description: Description of the knowledge base
      default: RAG knowledge base for Aphex platform repositories
    - name: repositories
      type: string
      description: JSON array of repository configurations
      default: |
        [
          {"url": "https://github.com/bdchatham/AphexPlatformInfrastructure", "branch": "main", "paths": [".kiro/docs"]},
          {"url": "https://github.com/bdchatham/ArchonKnowledgeBaseInfrastructure", "branch": "mainline", "paths": [".kiro/docs"]},
          {"url": "https://github.com/bdchatham/ArchonAgent", "branch": "main", "paths": [".kiro/docs"]},
          {"url": "https://github.com/bdchatham/AphexCLI", "branch": "main", "paths": [".kiro/docs"]}
        ]
    - name: enable-mcp
      type: string
      description: Enable MCP server for Kiro integration (true/false)
      default: "true"
    - name: mcp-image
      type: string
      description: MCP server container image
      default: ghcr.io/bdchatham/archon-mcp-server:latest
    - name: mcp-port
      type: string
      description: MCP server port
      default: "3000"

  tasks:
    - name: create-knowledgebase-crd
      params:
        - name: kb-name
          value: $(params.kb-name)
        - name: namespace
          value: $(params.namespace)
        - name: display-name
          value: $(params.display-name)
        - name: description
          value: $(params.description)
        - name: repositories
          value: $(params.repositories)
        - name: enable-mcp
          value: $(params.enable-mcp)
        - name: mcp-image
          value: $(params.mcp-image)
        - name: mcp-port
          value: $(params.mcp-port)
      taskSpec:
        params:
          - name: kb-name
          - name: namespace
          - name: display-name
          - name: description
          - name: repositories
          - name: enable-mcp
          - name: mcp-image
          - name: mcp-port
        steps:
          - name: create-knowledgebase
            image: bitnami/kubectl:latest
            script: |
              #!/bin/bash
              set -e

              echo "Creating KnowledgeBase CRD: $(params.kb-name)"
              echo "Namespace: $(params.namespace)"
              echo "Display Name: $(params.display-name)"

              # Parse repositories JSON and convert to YAML
              REPOS_YAML=$(echo '$(params.repositories)' | python3 -c '
              import sys, json, yaml
              repos = json.load(sys.stdin)
              print(yaml.dump(repos, default_flow_style=False, indent=2))
              ' | sed 's/^/    /')

              # Build the KnowledgeBase manifest
              cat <<EOF | kubectl apply -f -
              apiVersion: aphex.io/v1alpha1
              kind: KnowledgeBase
              metadata:
                name: $(params.kb-name)
                namespace: $(params.namespace)
              spec:
                displayName: "$(params.display-name)"
                description: "$(params.description)"
                repositories:
              ${REPOS_YAML}
              EOF

              # Add MCP configuration if enabled
              if [ "$(params.enable-mcp)" = "true" ]; then
                echo "Enabling MCP server"
                kubectl patch knowledgebase $(params.kb-name) -n $(params.namespace) --type=merge -p '{
                  "spec": {
                    "mcp": {
                      "image": "$(params.mcp-image)",
                      "port": $(params.mcp-port),
                      "replicas": 1
                    }
                  }
                }'
              fi

              echo ""
              echo "✓ KnowledgeBase '$(params.kb-name)' created successfully"
              echo ""
              echo "Check status:"
              echo "  kubectl get knowledgebase $(params.kb-name) -n $(params.namespace)"
              echo ""
              kubectl get knowledgebase $(params.kb-name) -n $(params.namespace)
